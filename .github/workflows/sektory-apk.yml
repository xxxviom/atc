name: Сектори ACC — збірка APK

on:
  push:
    branches: [main]
    paths: ['sektory/**', 'sektory-android/**', '.github/workflows/sektory-apk.yml']
  pull_request:
    paths: ['sektory/**', 'sektory-android/**', '.github/workflows/sektory-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Залежності
        working-directory: sektory-android
        run: npm install

      - name: Створити Android-проєкт
        working-directory: sektory-android
        run: npx cap add android

      - name: Іконки
        working-directory: sektory-android
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f1720' --iconBackgroundColorDark '#0f1720'

      - name: Скопіювати веб-файли в застосунок
        working-directory: sektory-android
        run: npx cap sync android

      # Підпис debug-ключем. Кеш зберігає ключ між збірками, щоб нову версію можна було ставити поверх старої.
      - name: Відновити debug-ключ
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sektory-debug-keystore-v1

      - name: Зібрати APK
        working-directory: sektory-android/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sektory-acc-apk
          path: sektory-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Опублікувати APK у Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp sektory-android/android/app/build/outputs/apk/debug/app-debug.apk sektory-acc.apk
          gh release delete sektory-latest --yes --cleanup-tag || true
          gh release create sektory-latest sektory-acc.apk \
            --title "Сектори ACC (APK)" \
            --notes "Остання збірка Android-застосунку. Завантаж sektory-acc.apk і встанови на телефоні." \
            --prerelease --target "${{ github.sha }}"
