name: Довідник ATC — збірка APK

on:
  push:
    branches: [main]
    paths-ignore: ['sektory/**', 'tools/**', '.well-known/**', '**.md']
  pull_request:
    paths-ignore: ['sektory/**', 'tools/**', '.well-known/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Зібрати веб-файли застосунку
        run: |
          mkdir -p apk/www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='apk' --exclude='tools' \
            --exclude='sektory' --exclude='.well-known' --exclude='*.md' --exclude='.gitignore' \
            ./ apk/www/
          du -sh apk/www

      - name: Залежності
        working-directory: apk
        run: npm install

      - name: Створити Android-проєкт
        working-directory: apk
        run: npx cap add android

      - name: Іконки
        working-directory: apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f2a43' --iconBackgroundColorDark '#0f2a43'

      - name: Портретна орієнтація
        working-directory: apk
        run: sed -i '0,/<activity /s//<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Скопіювати веб-файли в застосунок
        working-directory: apk
        run: npx cap sync android

      # Підпис debug-ключем. Кеш зберігає ключ між збірками, щоб нову версію можна було ставити поверх старої.
      - name: Відновити debug-ключ
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atc-debug-keystore-v1

      - name: Зібрати APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dovidnyk-atc-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Опублікувати APK у Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk dovidnyk-atc.apk
          gh release delete atc-latest --yes --cleanup-tag || true
          gh release create atc-latest dovidnyk-atc.apk \
            --title "Довідник ATC (APK)" \
            --notes "Остання збірка Android-застосунку. Завантаж dovidnyk-atc.apk і встанови на телефоні." \
            --prerelease --target "${{ github.sha }}"
